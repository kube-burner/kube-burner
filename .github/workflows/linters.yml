name: Linters
on:
  workflow_call:
jobs:
  linters:
    runs-on: ubuntu-latest
    steps:

    - name: Check out code
      uses: actions/checkout@v7
      with:
        fetch-depth: 1

    - name: Install pre-commit
      run: pip install pre-commit

    - name: Run pre-commit hooks
      run: pre-commit run --all-files
