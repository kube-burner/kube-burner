# image-upload.yml
name: Upload containers to Quay
on:
  workflow_call:
    secrets:
      QUAY_USER:
        required: true
      QUAY_TOKEN:
        required: true
jobs:
  containers:
    name: Build container images
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch:
        - arm64
        - amd64
        - ppc64le
        - s390x

    steps:
      - name: Install dependencies required for multi-arch builds
        run: sudo apt-get update && sudo apt-get install qemu-user-static podman fuse-overlayfs

      - name: Upgrade crun (actions/runner-images#14473)
        run: |
          CRUN_VERSION=1.28
          CRUN_URL=https://github.com/containers/crun/releases/download
          CRUN_URL="${CRUN_URL}/${CRUN_VERSION}"
          CRUN_SHA256=2aa6b7024a9c9f153895c0d11ae233d3758f54844011c3a039e3e89048d01d42
          curl -fsSL \
            "${CRUN_URL}/crun-${CRUN_VERSION}-linux-amd64" \
            -o /tmp/crun
          echo "${CRUN_SHA256}  /tmp/crun" | sha256sum --check
          sudo install -m 0755 /tmp/crun /usr/bin/crun
          crun --version

      - name: Set up Go 1.25
        uses: actions/setup-go@v7
        with:
          go-version: "1.25"

      - name: Check out code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Login in quay
        run: podman login quay.io -u="${QUAY_USER}" -p="${QUAY_TOKEN}"
        env:
          QUAY_USER: ${{ secrets.QUAY_USER }}
          QUAY_TOKEN: ${{ secrets.QUAY_TOKEN }}

      - name: Build kube-burner binary
        run: make build
        env:
          ARCH: ${{ matrix.arch }}

      - name: Build container image
        run: make images
        env:
          ARCH: ${{ matrix.arch }}
          ORG: ${GITHUB_REPOSITORY_OWNER}

      - name: Push container image
        run: make push
        env:
          ARCH: ${{ matrix.arch }}
          ORG: ${GITHUB_REPOSITORY_OWNER}

  manifest:
    name: Build container manifest
    runs-on: ubuntu-latest
    needs: containers
    steps:

      - name: Check out code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Login in quay
        run: podman login quay.io -u="${QUAY_USER}" -p="${QUAY_TOKEN}"
        env:
          QUAY_USER: ${{ secrets.QUAY_USER }}
          QUAY_TOKEN: ${{ secrets.QUAY_TOKEN }}

      - name: Create and push manifest
        run: make manifest
        env:
          ORG: ${GITHUB_REPOSITORY_OWNER}
